# \u662F\u5426\u6CE8\u518C\u9ED8\u8BA4\u9A8C\u8BC1\u7801\u63A7\u5236\u5668, \u9ED8\u8BA4\u503C: true
ymp.configs.module.captcha.service_enabled=false

# \u670D\u52A1\u7AEF\u4EE4\u724C\u52A0\u89E3\u5BC6\u9644\u52A0\u5BC6\u94A5, \u9ED8\u8BA4\u503C: ""
ymp.configs.module.captcha.service_auth_key=

# \u670D\u52A1\u7AEF\u4EE4\u724C\u52A0\u89E3\u5BC6\u9644\u52A0\u5BC6\u94A5\u662F\u5426\u5DF2\u52A0\u5BC6, \u9ED8\u8BA4\u503C: false
ymp.configs.module.captcha.service_auth_key_encrypted=false

# \u670D\u52A1\u7AEF\u4EE4\u724C\u52A0\u89E3\u5BC6\u9644\u52A0\u5BC6\u94A5\u5904\u7406\u5668, \u53EF\u9009\u53C2\u6570, \u7528\u4E8E\u5BF9\u5DF2\u52A0\u5BC6\u7801\u5BC6\u94A5\u8FDB\u884C\u89E3\u5BC6, \u9ED8\u8BA4\u503C: \u7A7A
ymp.configs.module.captcha.service_auth_key_password_class=

# \u9AD8\u5EA6, \u9ED8\u8BA4: 70px
ymp.configs.module.captcha.height=70

# \u5BBD\u5EA6, \u9ED8\u8BA4: 200px
ymp.configs.module.captcha.width=200

# \u524D\u666F\u8272, RGB\u503C, \u5982: 0,0,0|1,2,3, \u591A\u4E2A\u989C\u8272\u7528'|'\u5206\u9694, \u9ED8\u8BA4: \u968F\u673A
ymp.configs.module.captcha.foregrounds=

# \u80CC\u666F\u8272, RBG\u503C, \u9ED8\u8BA4: 255,255,255
ymp.configs.module.captcha.background=255,255,255

# \u8D28\u91CF, \u53EF\u9009\u503C: min|default|max, \u9ED8\u8BA4: max
ymp.configs.module.captcha.quality=max

# \u538B\u7F29\u6BD4, 0-1\u4E4B\u95F4, \u9ED8\u8BA4: \u7A7A
ymp.configs.module.captcha.compress_ratio=0.7

# \u56FE\u7247\u683C\u5F0F, \u53EF\u9009\u503C: png|jpeg, \u9ED8\u8BA4: jpeg
ymp.configs.module.captcha.format=jpeg

# \u81EA\u5B9A\u4E49\u5B57\u4F53\u914D\u7F6E\u5206\u6790\u5668, \u53EF\u9009\u53C2\u6570, \u9ED8\u8BA4\u503C: net.ymate.module.captcha.impl.DefaultCaptchaFontsParser
# \u82E5\u5E0C\u671B\u901A\u8FC7\u6307\u5B9A\u6587\u4EF6\u52A0\u8F7D\u5B57\u4F53, \u8BF7\u4F7F\u7528: net.ymate.module.captcha.impl.FileCaptchaFontsParser
# \u6216\u901A\u8FC7\u5B9E\u73B0net.ymate.module.captcha.ICaptchaFontsParser\u63A5\u53E3\u81EA\u5B9A\u4E49\u52A0\u8F7D\u65B9\u5F0F
ymp.configs.module.captcha.fonts_parser_class=net.ymate.module.captcha.impl.FileCaptchaFontsParser

# \u81EA\u5B9A\u4E49\u5B57\u4F53, \u53EF\u9009\u53C2\u6570, \u683C\u5F0F: [\u5B57\u4F53\u540D\u79F0:SansSerif],[\u5B57\u4F53\u6837\u5F0F:plain|bold|italic], \u591A\u4E2A\u5B57\u4F53\u7528'|'\u5206\u9694, \u9ED8\u8BA4: \u968F\u673A
# \u5F53\u81EA\u5B9A\u4E49\u5B57\u4F53\u914D\u7F6E\u5206\u6790\u5668\u4E3A\u901A\u8FC7\u6587\u4EF6\u52A0\u8F7D\u65F6, \u914D\u7F6E\u683C\u5F0F: [\u5B57\u4F53\u683C\u5F0F:type1|truetype],[\u5B57\u4F53\u6837\u5F0F:plain|bold|italic],<\u6587\u4EF6\u8DEF\u5F84:${root}/fonts/SansSerif.ttf>, \u591A\u4E2A\u5B57\u4F53\u7528'|'\u5206\u9694
ymp.configs.module.captcha.fonts=SansSerif,plain|Yahei,bold

# \u56FE\u7247\u751F\u6210\u6548\u679C\u53C2\u6570\u8BBE\u7F6E: \u7F29\u653E, \u53D6\u503C\u8303\u56F4: [0-1, 0-1], \u9ED8\u8BA4: 1,1
ymp.configs.module.captcha.effect.scale=1,1

# \u56FE\u7247\u751F\u6210\u6548\u679C\u53C2\u6570\u8BBE\u7F6E: \u6CE2\u6D6A, \u9ED8\u8BA4\u503C: true
ymp.configs.module.captcha.effect.ripple=true

# \u56FE\u7247\u751F\u6210\u6548\u679C\u53C2\u6570\u8BBE\u7F6E: \u6A21\u7CCA, \u9ED8\u8BA4\u503C: true
ymp.configs.module.captcha.effect.blur=true

# \u56FE\u7247\u751F\u6210\u6548\u679C\u53C2\u6570\u8BBE\u7F6E: \u8F6E\u5ED3, \u9ED8\u8BA4\u503C: false
ymp.configs.module.captcha.effect.outline=true

# \u56FE\u7247\u751F\u6210\u6548\u679C\u53C2\u6570\u8BBE\u7F6E: \u65CB\u8F6C, \u9ED8\u8BA4\u503C: true
ymp.configs.module.captcha.effect.rotate=true
