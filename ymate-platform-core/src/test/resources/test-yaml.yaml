# YAML 解析测试文件: 包含嵌套 Map、集合、标量、null 值及空集合
ymp:
  dev_mode: false
  version: 2.1.4
  excluded_packages:
    - com.test
    - com.demo
  configs:
    jdbc:
      connection_url: jdbc:mysql://localhost/test
      max_pool_size: 20
  null_value: ~
  empty_list: [ ]
